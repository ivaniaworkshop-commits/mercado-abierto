name: Public source integrity
on:
  push:
    branches:
      - main
      - 'publish/**'
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q source/app
      - name: Public-source guard
        run: python scripts/audit_public_source.py
      - name: Existing AMA site tests
        run: python -m unittest discover -s tests -v
